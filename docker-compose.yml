services:
  apt-cacher-ng:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acng-https
    restart: unless-stopped
    environment:
      BACKEND_DOMAIN: ${BACKEND_DOMAIN:?Set BACKEND_DOMAIN in .env}
    ports:
      - "443:443"
    volumes:
      - apt_cache:/var/cache/apt-cacher-ng
      - ./letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD", "busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3142/acng-report.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  apt_cache:
