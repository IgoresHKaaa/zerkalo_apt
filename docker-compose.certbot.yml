services:
  certbot:
    image: certbot/certbot:latest
    restart: "no"
    ports:
      - "80:80"
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./letsencrypt-lib:/var/lib/letsencrypt
    command: >
      certonly
      --standalone
      --non-interactive
      --keep-until-expiring
      --preferred-challenges http
      --agree-tos
      --no-eff-email
      --email ${CERTBOT_EMAIL}
      --domain ${BACKEND_DOMAIN}
