services:
  certbot:
    image: certbot/certbot:latest
    container_name: acng-certbot
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./letsencrypt-lib:/var/lib/letsencrypt
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while :; do
          certbot renew --standalone --non-interactive --preferred-challenges http;
          sleep 43200;
        done
